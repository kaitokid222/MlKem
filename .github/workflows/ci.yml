name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore MlKemNet.sln --locked-mode

      - name: Verify formatting
        run: dotnet format MlKemNet.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MlKemNet.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution MlKemNet.sln --configuration Release --no-build
